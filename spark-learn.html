<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星火學習導航 Spark Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { plex: ['"IBM Plex Sans"', 'Helvetica Neue', 'Arial', 'sans-serif'] },
          colors: {
            'ibm-blue':    '#0f62fe',
            'ibm-blue-hover': '#0353e9',
            'ibm-blue-80': '#002d9c',
            'ink':         '#161616',
            'ink-muted':   '#525252',
            'ink-subtle':  '#8c8c8c',
            'surface-1':   '#f4f4f4',
            'surface-2':   '#e0e0e0',
            'hairline':    '#e0e0e0',
          },
          letterSpacing: { carbon: '0.16px' },
          borderRadius:  { none: '0px' },
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.16px; }

    /* Carbon input focus: 2px blue bottom underline */
    .carbon-input {
      background: #f4f4f4;
      border: none;
      border-bottom: 1px solid #e0e0e0;
      padding: 11px 16px;
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      color: #161616;
      outline: none;
      letter-spacing: 0.16px;
      border-radius: 0;
    }
    .carbon-input:focus { border-bottom: 2px solid #0f62fe; }
    .carbon-input::placeholder { color: #8c8c8c; }

    /* Category filter button */
    .filter-btn {
      background: #f4f4f4;
      border: 1px solid #e0e0e0;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 0.16px;
      color: #525252;
      cursor: pointer;
      white-space: nowrap;
      border-radius: 0;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      min-height: 40px;
    }
    .filter-btn:hover  { background: #e0e0e0; color: #161616; }
    .filter-btn.active { background: #161616; color: #ffffff; border-color: #161616; }

    /* Primary CTA button */
    .btn-primary {
      background: #0f62fe;
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 0.16px;
      cursor: pointer;
      border-radius: 0;
      display: inline-block;
      text-decoration: none;
      transition: background 0.1s;
      min-height: 48px;
      line-height: 1.29;
    }
    .btn-primary:hover  { background: #0353e9; }
    .btn-primary:active { background: #002d9c; }

    /* Resource card */
    .resource-card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .resource-card:hover { background: #f4f4f4; }

    /* Low-bandwidth badge */
    .badge-low-bw {
      background: #defbe6;
      color: #0e6027;
      border: 1px solid #a7f0ba;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 9999px;
      display: inline-block;
      letter-spacing: 0.32px;
    }
    .badge-level {
      background: #f4f4f4;
      color: #525252;
      border: 1px solid #e0e0e0;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 9999px;
      display: inline-block;
      letter-spacing: 0.32px;
    }
    .badge-category {
      background: #edf5ff;
      color: #0043ce;
      border: 1px solid #d0e2ff;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 9999px;
      display: inline-block;
      letter-spacing: 0.32px;
    }

    /* Hide utility bar on mobile */
    @media (max-width: 671px) { .utility-bar { display: none; } }

    /* Filter scroll on mobile */
    .filter-scroll { overflow-x: auto; scrollbar-width: none; }
    .filter-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-white text-ink min-h-screen">

  <!-- ── Utility Bar (desktop only) ──────────────────────────────────── -->
  <div class="utility-bar bg-surface-1 border-b border-hairline">
    <div class="max-w-6xl mx-auto px-4 h-8 flex items-center justify-end">
      <span class="text-xs text-ink-muted">本站所有資源免費，無需帳號 · 為偏鄉學生設計</span>
    </div>
  </div>

  <!-- ── Top Nav ──────────────────────────────────────────────────────── -->
  <header class="bg-white border-b border-hairline sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-12 flex items-center gap-3">
      <!-- Spark icon (SVG) -->
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M11 2L4 11h6l-1 7 7-9h-6l1-7z" fill="#0f62fe"/>
      </svg>
      <span class="font-semibold text-ink text-base leading-none tracking-carbon">星火學習導航</span>
      <span class="text-ink-subtle text-sm hidden sm:inline">Spark Learn</span>
    </div>
  </header>

  <!-- ── Hero ────────────────────────────────────────────────────────── -->
  <section class="bg-white border-b border-hairline">
    <div class="max-w-6xl mx-auto px-4 py-10 sm:py-16">
      <p class="text-xs text-ibm-blue uppercase tracking-widest mb-3" style="letter-spacing:0.08em;">免費 · 輕量 · 為你而生</p>
      <h1 class="text-3xl sm:text-5xl font-light text-ink leading-tight mb-4" style="letter-spacing:-0.3px;">
        不管在哪裡，<br class="hidden sm:block"/>好的學習資源<br class="sm:hidden"/>都該是你的。
      </h1>
      <p class="text-base sm:text-lg text-ink-muted max-w-xl" style="letter-spacing:0.16px;line-height:1.5;">
        這裡收錄了適合偏鄉學生的免費學習資源，部分資源支援低頻寬或離線使用。
        不需要帳號，直接開始學習。
      </p>
    </div>
  </section>

  <!-- ── Search & Filter ─────────────────────────────────────────────── -->
  <section class="bg-surface-1 border-b border-hairline sticky top-12 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col gap-3">
      <!-- Search -->
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-subtle" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="5" stroke="#8c8c8c" stroke-width="1.5"/>
          <path d="M10.5 10.5L14 14" stroke="#8c8c8c" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
        <input
          id="search-input"
          type="search"
          class="carbon-input pl-10"
          placeholder="搜尋資源名稱、科目、關鍵字…"
          aria-label="搜尋學習資源"
          oninput="renderCards()"
        />
      </div>
      <!-- Category filter -->
      <div class="filter-scroll flex gap-2 pb-1">
        <button class="filter-btn active" data-cat="全部"        onclick="setCategory(this)">全部</button>
        <button class="filter-btn"        data-cat="基礎學科"     onclick="setCategory(this)">基礎學科</button>
        <button class="filter-btn"        data-cat="程式入門"     onclick="setCategory(this)">程式入門</button>
        <button class="filter-btn"        data-cat="語言學習"     onclick="setCategory(this)">語言學習</button>
        <button class="filter-btn"        data-cat="免流量推薦"   onclick="setCategory(this)">📶 免流量 / 低頻寬推薦</button>
      </div>
    </div>
  </section>

  <!-- ── Resource Cards ──────────────────────────────────────────────── -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="result-count" class="text-sm text-ink-muted mb-4" aria-live="polite"></div>
    <div id="card-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-px bg-hairline border border-hairline"></div>
    <div id="empty-state" class="hidden text-center py-20 text-ink-muted">
      <svg class="mx-auto mb-4" width="40" height="40" viewBox="0 0 40 40" fill="none">
        <circle cx="18" cy="18" r="13" stroke="#8c8c8c" stroke-width="2"/>
        <path d="M27 27L36 36" stroke="#8c8c8c" stroke-width="2" stroke-linecap="square"/>
        <path d="M13 18h10M18 13v10" stroke="#8c8c8c" stroke-width="2"/>
      </svg>
      <p class="text-base">找不到符合的資源，請試試其他關鍵字。</p>
    </div>
  </main>

  <!-- ── CTA Banner ───────────────────────────────────────────────────── -->
  <section class="bg-ibm-blue">
    <div class="max-w-6xl mx-auto px-4 py-12 sm:py-16 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6">
      <div>
        <h2 class="text-2xl sm:text-3xl font-light text-white mb-2">知道有適合的資源卻不在這裡？</h2>
        <p class="text-base text-blue-200" style="letter-spacing:0.16px;">歡迎提交資源，讓更多偏鄉學生受惠。</p>
      </div>
      <a href="https://forms.gle/" target="_blank" rel="noopener"
         class="btn-primary bg-white text-ibm-blue hover:bg-surface-1 shrink-0"
         style="background:#ffffff;color:#0f62fe;">
        提交資源推薦 →
      </a>
    </div>
  </section>

  <!-- ── Footer ───────────────────────────────────────────────────────── -->
  <footer class="bg-ink text-white">
    <div class="max-w-6xl mx-auto px-4 py-10 flex flex-col sm:flex-row sm:items-start sm:justify-between gap-8">
      <div>
        <div class="flex items-center gap-2 mb-3">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <path d="M11 2L4 11h6l-1 7 7-9h-6l1-7z" fill="#ffffff"/>
          </svg>
          <span class="font-semibold text-white text-sm">星火學習導航 Spark Learn</span>
        </div>
        <p class="text-xs text-gray-400 max-w-xs" style="letter-spacing:0.16px;line-height:1.6;">
          免費、無廣告、為偏鄉學生設計的學習資源導航站。<br/>本站資料定期更新，歡迎推薦好資源。
        </p>
      </div>
      <div class="text-xs text-gray-500" style="letter-spacing:0.16px;">
        <p>資料來源：各平台公開資訊</p>
        <p class="mt-1">以 IBM Bob AI 協助開發</p>
      </div>
    </div>
  </footer>

  <!-- ── JavaScript ───────────────────────────────────────────────────── -->
  <script>
    // ─────────────────────────────────────────────────────────────────
    // 📌 假資料區：直接修改這個陣列，之後可替換成 Google 試算表 API 呼叫
    //    每個物件欄位說明：
    //    - name       : 資源名稱
    //    - category   : 分類（需對應 filter 按鈕的 data-cat 值）
    //    - level      : 適合對象（如 國中、高中、國高中、全年齡）
    //    - description: 簡短介紹（建議 50 字以內）
    //    - url        : 前往學習的連結
    //    - lowBw      : true = 顯示低頻寬推薦標章
    // ─────────────────────────────────────────────────────────────────
    const RESOURCES = [
      {
        name:        '均一教育平台',
        category:    '基礎學科',
        level:       '國高中',
        description: '涵蓋國中小至高中數學、自然、社會的影片與練習題，免費、免帳號即可觀看大部分內容。',
        url:         'https://www.junyiacademy.org/',
        lowBw:       false,
      },
      {
        name:        'Khan Academy（可汗學院）',
        category:    '基礎學科',
        level:       '全年齡',
        description: '全球最大免費學習平台，涵蓋數學、科學、人文等，已有繁體中文字幕，支援低網速播放。',
        url:         'https://zh.khanacademy.org/',
        lowBw:       true,
      },
      {
        name:        'CS50（哈佛程式入門）',
        category:    '程式入門',
        level:       '高中以上',
        description: '全球最受歡迎的程式入門課程，繁體中文字幕版免費，從 Scratch 到 Python、Web 開發都涵蓋。',
        url:         'https://cs50.harvard.edu/x/',
        lowBw:       false,
      },
      {
        name:        'Scratch 程式設計',
        category:    '程式入門',
        level:       '國中',
        description: '麻省理工學院開發的積木式程式語言，支援中文介面，不需安裝，瀏覽器直接使用，適合初學者。',
        url:         'https://scratch.mit.edu/',
        lowBw:       true,
      },
      {
        name:        'Duolingo（多鄰國）',
        category:    '語言學習',
        level:       '全年齡',
        description: '遊戲化英語（及多語言）學習，每日 5 分鐘，免費版功能完整，支援離線練習，低頻寬友善。',
        url:         'https://www.duolingo.com/',
        lowBw:       true,
      },
      {
        name:        'VoiceTube 看影片學英文',
        category:    '語言學習',
        level:       '國高中',
        description: '以真實 YouTube 影片學英文，提供單字解釋與字幕，免費帳號即可使用基本功能，適合自學。',
        url:         'https://www.voicetube.com/',
        lowBw:       false,
      },
    ];
    // ─────────────────────────────────────────────────────────────────
    // 如何串接 Google 試算表：
    // 1. 將試算表「發布為 CSV」（檔案 → 共用 → 發布至網路 → CSV）
    // 2. 用 fetch(CSV_URL) 取得資料，用 papaparse 或手動解析 CSV
    // 3. 將解析後的物件陣列賦值給 RESOURCES，再呼叫 renderCards()
    // ─────────────────────────────────────────────────────────────────

    let currentCategory = '全部';

    function setCategory(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.cat;
      renderCards();
    }

    function renderCards() {
      const query   = document.getElementById('search-input').value.trim().toLowerCase();
      const grid    = document.getElementById('card-grid');
      const empty   = document.getElementById('empty-state');
      const counter = document.getElementById('result-count');

      const filtered = RESOURCES.filter(r => {
        const matchCat = currentCategory === '全部'
          || r.category === currentCategory
          || (currentCategory === '免流量推薦' && r.lowBw);
        const matchQ = !query
          || r.name.toLowerCase().includes(query)
          || r.description.toLowerCase().includes(query)
          || r.category.toLowerCase().includes(query)
          || r.level.toLowerCase().includes(query);
        return matchCat && matchQ;
      });

      // Update counter
      counter.textContent = `顯示 ${filtered.length} 筆資源${query ? `（關鍵字：${query}）` : ''}`;

      if (filtered.length === 0) {
        grid.innerHTML  = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      grid.innerHTML = filtered.map(r => `
        <article class="resource-card bg-white">
          <div class="flex flex-wrap gap-1">
            <span class="badge-category">${r.category}</span>
            <span class="badge-level">${r.level}</span>
            ${r.lowBw ? '<span class="badge-low-bw">📶 低頻寬友善</span>' : ''}
          </div>
          <h3 class="text-base font-semibold text-ink leading-snug" style="letter-spacing:0.16px;">${r.name}</h3>
          <p class="text-sm text-ink-muted flex-1" style="letter-spacing:0.16px;line-height:1.5;">${r.description}</p>
          <a href="${r.url}" target="_blank" rel="noopener" class="btn-primary text-center mt-auto">
            前往學習 →
          </a>
        </article>
      `).join('');
    }

    // Initial render
    renderCards();
  </script>
</body>
</html>
